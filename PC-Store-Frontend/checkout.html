<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Toán | AeroTech</title>
  <meta name="description" content="Hoàn tất đơn hàng tại AeroTech.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkout-page { max-width: 1100px; margin: 120px auto 60px; padding: 0 20px; }
    .checkout-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; }
    .checkout-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; }
    .checkout-card h2 { margin-bottom: 25px; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
    .checkout-card h2 i { color: var(--primary); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border-color);
      background: rgba(255,255,255,0.03); color: var(--text-main); font-size: 1rem; transition: border 0.3s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .order-item { display: flex; gap: 15px; padding: 12px 0; border-bottom: 1px solid var(--border-color); align-items: center; }
    .order-item:last-child { border-bottom: none; }
    .order-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; background: #1a1a2e; }
    .order-item-info { flex: 1; }
    .order-item-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .order-item-price { color: var(--primary); font-size: 0.9rem; }
    .order-item-qty { color: var(--text-muted); font-size: 0.85rem; }

    .order-summary { margin-top: 20px; padding-top: 15px; border-top: 2px solid var(--border-color); }
    .summary-row { display: flex; justify-content: space-between; padding: 6px 0; color: var(--text-muted); }
    .summary-row.total { font-size: 1.3rem; font-weight: 700; color: var(--primary); padding-top: 12px; border-top: 1px solid var(--border-color); margin-top: 8px; }

    .checkout-submit { width: 100%; padding: 16px; font-size: 1.1rem; margin-top: 20px; }

    .checkout-empty { text-align: center; padding: 60px 20px; grid-column: 1 / -1; }
    .checkout-empty i { font-size: 3rem; color: var(--text-muted); margin-bottom: 15px; }

    /* Payment method cards */
    .payment-options { display: flex; gap: 12px; }
    .payment-option { flex: 1; padding: 15px; border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; text-align: center; transition: all 0.3s; }
    .payment-option:hover { border-color: var(--primary); }
    .payment-option.selected { border-color: var(--primary); background: rgba(0,225,255,0.08); }
    .payment-option i { font-size: 1.5rem; margin-bottom: 8px; display: block; color: var(--primary); }
    .payment-option input[type="radio"] { display: none; }

    /* Success overlay */
    .success-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .success-card { background: var(--surface-color); border: 1px solid var(--primary); border-radius: 20px; padding: 50px; text-align: center; max-width: 450px; animation: fadeIn 0.5s ease; }
    .success-card i.check { font-size: 4rem; color: #4ecdc4; margin-bottom: 20px; }
    .success-card h2 { margin-bottom: 10px; color: var(--primary); }
    .success-card .order-id { font-size: 1.2rem; color: var(--text-main); background: rgba(0,225,255,0.1); padding: 10px 20px; border-radius: 8px; display: inline-block; margin: 15px 0; font-family: monospace; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    @media (max-width: 768px) {
      .checkout-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="container nav-container">
      <div class="nav-left">
        <a href="index.html" class="logo">
          <i class="fa-solid fa-microchip"></i> Aero<span>Tech</span>
        </a>
      </div>
      <div class="nav-icons">
        <a href="products.html" style="color:var(--text-muted)"><i class="fa-solid fa-arrow-left"></i> Tiếp tục mua</a>
      </div>
    </div>
  </header>

  <!-- Checkout Content -->
  <div class="checkout-page" id="checkoutPage">
    <!-- Rendered by JS -->
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span>Thông báo</span>
  </div>

  <script src="js/main.js"></script>
  <script>
    const API = 'http://localhost:5000';
    const checkoutPage = document.getElementById('checkoutPage');
    const cart = getCart();

    if (cart.length === 0) {
      checkoutPage.innerHTML = `
        <div class="checkout-empty">
          <i class="fa-solid fa-cart-shopping"></i>
          <h2>Giỏ hàng trống</h2>
          <p style="color:var(--text-muted);margin:15px 0">Bạn chưa có sản phẩm nào trong giỏ hàng.</p>
          <a href="products.html" class="btn btn-primary"><i class="fa-solid fa-bag-shopping"></i> Mua sắm ngay</a>
        </div>`;
    } else {
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const itemCount = cart.reduce((s, i) => s + i.qty, 0);

      // Pre-fill from auth
      const auth = JSON.parse(localStorage.getItem('aeroTechAuth') || 'null');
      const prefillName = auth?.user?.full_name || '';

      checkoutPage.innerHTML = `
        <div class="checkout-grid">
          <div class="checkout-card">
            <h2><i class="fa-solid fa-truck-fast"></i> Thông tin giao hàng</h2>
            <form id="checkoutForm">
              <div class="form-row">
                <div class="form-group">
                  <label>Họ và tên người nhận *</label>
                  <input type="text" id="cName" required placeholder="Nguyễn Văn A" value="${prefillName}">
                </div>
                <div class="form-group">
                  <label>Số điện thoại *</label>
                  <input type="tel" id="cPhone" required placeholder="0912 345 678">
                </div>
              </div>
              <div class="form-group">
                <label>Địa chỉ giao hàng *</label>
                <textarea id="cAddress" required placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"></textarea>
              </div>
              <div class="form-group">
                <label>Ghi chú đơn hàng</label>
                <input type="text" id="cNote" placeholder="VD: Giao giờ hành chính, gọi trước 30 phút">
              </div>

              <h2 style="margin-top:30px"><i class="fa-solid fa-credit-card"></i> Phương thức thanh toán</h2>
              <div class="payment-options">
                <label class="payment-option selected" id="optCOD">
                  <input type="radio" name="payment" value="COD" checked>
                  <i class="fa-solid fa-money-bill-wave"></i>
                  <strong>COD</strong><br><small>Thanh toán khi nhận hàng</small>
                </label>
                <label class="payment-option" id="optTransfer">
                  <input type="radio" name="payment" value="ChuyenKhoan">
                  <i class="fa-solid fa-building-columns"></i>
                  <strong>Chuyển khoản</strong><br><small>Chuyển khoản ngân hàng</small>
                </label>
              </div>

              <button type="submit" class="btn btn-primary checkout-submit" id="submitBtn">
                <i class="fa-solid fa-lock"></i> Xác nhận đặt hàng — ${total.toLocaleString('vi-VN')}đ
              </button>
            </form>
          </div>

          <div class="checkout-card">
            <h2><i class="fa-solid fa-bag-shopping"></i> Đơn hàng (${itemCount} sản phẩm)</h2>
            <div id="orderItems">
              ${cart.map(item => `
                <div class="order-item">
                  <img src="${item.image}" alt="${item.name}">
                  <div class="order-item-info">
                    <div class="order-item-name">${item.name}</div>
                    <div class="order-item-price">${item.price.toLocaleString('vi-VN')}đ</div>
                    <div class="order-item-qty">Số lượng: ${item.qty}</div>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="order-summary">
              <div class="summary-row"><span>Tạm tính (${itemCount} SP)</span><span>${total.toLocaleString('vi-VN')}đ</span></div>
              <div class="summary-row"><span>Phí vận chuyển</span><span style="color:#4ecdc4">Miễn phí</span></div>
              <div class="summary-row total"><span>Tổng cộng</span><span>${total.toLocaleString('vi-VN')}đ</span></div>
            </div>
          </div>
        </div>
      `;

      // Payment option toggle
      document.querySelectorAll('.payment-option').forEach(opt => {
        opt.addEventListener('click', () => {
          document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          opt.querySelector('input').checked = true;
        });
      });

      // Submit order
      document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';

        const payload = {
          customer_name: document.getElementById('cName').value.trim(),
          customer_phone: document.getElementById('cPhone').value.trim(),
          customer_address: document.getElementById('cAddress').value.trim(),
          payment_method: document.querySelector('input[name="payment"]:checked').value,
          items: cart.map(i => ({ id: i.id, price: i.price, qty: i.qty }))
        };

        try {
          const res = await fetch(`${API}/api/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();

          if (res.ok) {
            // Clear cart
            saveCart([]);
            updateCartBadge();

            // Show success
            const overlay = document.createElement('div');
            overlay.className = 'success-overlay';
            overlay.innerHTML = `
              <div class="success-card">
                <i class="fa-solid fa-circle-check check"></i>
                <h2>Đặt hàng thành công!</h2>
                <p style="color:var(--text-muted)">Cảm ơn bạn đã mua sắm tại AeroTech</p>
                <div class="order-id">${data.orderId}</div>
                <p style="color:var(--text-muted);font-size:0.9rem">Chúng tôi sẽ liên hệ xác nhận đơn hàng sớm nhất.</p>
                <a href="index.html" class="btn btn-primary" style="margin-top:20px;display:inline-block;padding:12px 30px">
                  <i class="fa-solid fa-house"></i> Về trang chủ
                </a>
              </div>`;
            document.body.appendChild(overlay);
          } else {
            alert(data.message || 'Có lỗi xảy ra.');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-lock"></i> Xác nhận đặt hàng';
          }
        } catch (err) {
          alert('Không thể kết nối server. Hãy kiểm tra Backend.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-lock"></i> Xác nhận đặt hàng';
        }
      });
    }
  </script>
</body>
</html>
