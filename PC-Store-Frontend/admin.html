<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị | AeroTech Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Admin Specific Styles */
    body { background-color: var(--surface-color); display: flex; height: 100vh; overflow: hidden; }
    .admin-sidebar { width: 280px; background: var(--bg-color); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; }
    .admin-logo { font-size: 1.5rem; margin-bottom: 40px; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .admin-logo span { color: #ff3366; } /* Highlight admin */
    .admin-nav { display: flex; flex-direction: column; gap: 10px; }
    .admin-nav a { padding: 12px 15px; border-radius: 8px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; transition: all 0.3s; }
    .admin-nav a:hover, .admin-nav a.active { background: rgba(0, 225, 255, 0.1); color: var(--primary); }
    .admin-nav a i { width: 20px; text-align: center; }
    .admin-logout { margin-top: auto; padding: 12px; color: #ff6b6b; cursor: pointer; display: flex; gap: 10px; align-items: center; }
    
    .admin-main { flex: 1; padding: 30px 40px; overflow-y: auto; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .admin-header h1 { font-size: 2rem; }
    
    .admin-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; margin-bottom: 30px; }
    .admin-card h3 { margin-bottom: 20px; color: var(--primary); font-size: 1.2rem; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.02); color: var(--text-main); }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); outline: none; }
    
    .table-wrapper { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    table th, table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
    table th { color: var(--text-muted); font-weight: 500; }
    table tr:hover { background: rgba(255,255,255,0.02); }
  </style>
</head>
<body>
  
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <a href="index.html" class="admin-logo">
      <i class="fa-solid fa-microchip"></i> Aero<span>Admin</span>
    </a>
    <nav class="admin-nav">
      <a href="#" class="active"><i class="fa-solid fa-chart-line"></i> Bảng điều khiển</a>
      <a href="#"><i class="fa-solid fa-laptop"></i> Quản lý Sản phẩm</a>
      <a href="#"><i class="fa-solid fa-barcode"></i> Nhập Serial (S/N)</a>
      <a href="#"><i class="fa-solid fa-cart-flatbed"></i> Quản lý Đơn hàng</a>
      <a href="#"><i class="fa-solid fa-screwdriver-wrench"></i> Quản lý Bảo hành</a>
    </nav>
    <div class="admin-logout" id="adminLogoutBtn">
      <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <div class="admin-header">
      <h1>Quản lý Sản phẩm & Kho</h1>
      <div id="adminGreeting">Xin chào, Admin</div>
    </div>

    <!-- Product Form -->
    <div class="admin-card">
      <h3>Thêm Sản Phẩm Mới (UC-13)</h3>
      <form id="addProductForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="form-group">
          <label>Tên Sản phẩm</label>
          <input type="text" id="pName" required placeholder="VD: Asus ROG Strix G15">
        </div>
        <div class="form-group">
          <label>Hãng (Brand ID)</label>
          <input type="number" id="pBrand" placeholder="1 = Asus, 2 = Dell...">
        </div>
        <div class="form-group">
          <label>CPU</label>
          <input type="text" id="pCpu" placeholder="VD: Intel Core i7 12700H">
        </div>
        <div class="form-group">
          <label>RAM & Ổ cứng</label>
          <input type="text" id="pRam" placeholder="VD: 16GB DDR5, 512GB SSD">
        </div>
        <div class="form-group">
          <label>Giá bán (VND)</label>
          <input type="number" id="pPrice" required placeholder="VD: 25000000">
        </div>
        <div class="form-group">
          <label>Bảo hành (tháng)</label>
          <input type="number" id="pWarranty" required value="24">
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Hình ảnh sản phẩm</label>
          <input type="file" id="pImage" accept="image/*">
        </div>


        <div class="form-group" style="grid-column: 1 / -1;">
          <button type="submit" class="btn btn-primary">Thêm Sản Phẩm</button>
        </div>
      </form>
      <div id="productMsg" style="margin-top: 15px; color: var(--primary);"></div>
    </div>

    <!-- Serial Import Form -->
    <div class="admin-card">
      <h3>Nhập Kho Serial (UC-15)</h3>
      <form id="importSerialForm" style="display: flex; gap: 20px; align-items: flex-end;">
        <div class="form-group" style="flex: 1;">
          <label>ID Sản phẩm</label>
          <input type="number" id="sProductId" required placeholder="ID của sản phẩm (VD: 1)">
        </div>
        <div class="form-group" style="flex: 3;">
          <label>Danh sách Serial (cách nhau bởi dấu phẩy)</label>
          <input type="text" id="sSerials" required placeholder="VD: SN1001, SN1002, SN1003">
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-outline" style="background: var(--primary); color: #000;">Nhập Kho</button>
        </div>
      </form>
      <div id="serialMsg" style="margin-top: 15px; color: var(--primary);"></div>
    </div>

    <!-- Products List -->
    <div class="admin-card">
      <h3>Danh sách Sản phẩm hiện tại</h3>
      <div class="table-wrapper">
        <table id="productsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Ảnh</th>
              <th>Tên SP</th>
              <th>CPU</th>
              <th>RAM & SSD</th>
              <th>Giá</th>
              <th>Bảo hành</th>
            </tr>
          </thead>
          <tbody>
            <!-- Dữ liệu render từ API -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="js/admin.js"></script>
</body>
</html>
