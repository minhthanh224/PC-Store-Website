<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dịch vụ kỹ thuật - AeroTech</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main class="services-page">
    <section class="services-hero">
      <div class="container services-hero-inner">
        <p class="eyebrow">AeroTech Service</p>
        <h1>Dịch vụ kỹ thuật AeroTech</h1>
        <p>Tư vấn build PC, vệ sinh, nâng cấp, cài đặt và hỗ trợ kỹ thuật cho thiết bị của bạn.</p>
        <div class="services-hero-actions">
          <a class="btn btn-primary" href="#service-list">Xem dịch vụ</a>
          <a class="btn btn-outline" href="contact.html">Liên hệ tư vấn</a>
        </div>
      </div>
    </section>

    <section class="container services-content" id="service-list">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Danh sách dịch vụ</p>
          <h2>Chọn dịch vụ phù hợp</h2>
        </div>
      </div>
      <div id="serviceGrid" class="service-grid loading-box">Đang tải dịch vụ...</div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart-store.js"></script>
  <script src="assets/js/layout.js"></script>
