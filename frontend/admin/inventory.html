<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Serial - AeroTech</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside id="adminSidebar" class="admin-sidebar"></aside>
    <main class="admin-main">
      <header id="adminTopbar" class="admin-topbar"></header>
      <section class="admin-content">
        <div class="admin-page-heading">
          <p class="eyebrow">Inventory</p>
          <h1>Kho Serial</h1>
          <p class="page-subtitle">Theo dõi serial, tồn kho, hàng đã bán, bảo hành và hàng trả về.</p>
        </div>
        <div id="inventoryTabs" class="admin-order-tabs admin-inventory-tabs" role="tablist">
          <button class="active" type="button" data-tab="overview">Tổng quan kho</button>
          <button type="button" data-tab="add">Thêm Serial</button>
          <button type="button" data-tab="serials">Danh sách Serial</button>
        </div>

        <section id="inventoryOverviewPanel" class="admin-tab-panel" data-tab-panel="overview">
          <form id="inventorySummaryFilterForm" class="admin-filter-bar">
            <input id="inventorySummaryKeyword" type="search" placeholder="Tìm sản phẩm hoặc SKU">
            <select id="inventorySummaryStatus">
              <option value="">Tất cả tồn kho</option>
              <option value="low_stock">Tồn thấp</option>
              <option value="in_stock">Còn hàng</option>
              <option value="out_stock">Hết hàng</option>
              <option value="requires_serial">Có quản lý Serial</option>
            </select>
            <button class="btn btn-dark" type="submit">Lọc</button>
            <button id="resetInventorySummaryFilterBtn" class="btn btn-light" type="button">Làm mới</button>
          </form>
          <div id="inventorySummary" class="admin-table-wrap loading-box">Đang tải tồn kho...</div>
        </section>

        <section id="inventoryAddPanel" class="admin-panel admin-tab-panel" data-tab-panel="add" hidden>
          <h2>Thêm Serial</h2>
          <form id="serialForm" class="admin-inline-form">
            <label>Sản phẩm<select id="serialProduct" required></select></label>
            <label>Mã Serial<input id="serialCode" placeholder="SN-..." required></label>
            <label>Ngày nhập<input id="serialImportDate" type="date"></label>
            <label>Ghi chú<input id="serialNote" placeholder="Ghi chú kho"></label>
            <button class="btn btn-primary" type="submit">Thêm Serial</button>
          </form>
          <div id="serialMessage"></div>
        </section>

        <section id="inventorySerialsPanel" class="admin-panel admin-tab-panel" data-tab-panel="serials" hidden>
          <h2>Danh sách Serial</h2>
          <form id="serialFilterForm" class="admin-filter-bar">
            <input id="serialKeyword" type="search" placeholder="Tìm Serial, sản phẩm, SKU">
            <select id="serialStatus">
              <option value="">Tất cả trạng thái</option>
              <option value="in_stock">Trong kho</option>
              <option value="sold">Đã bán</option>
              <option value="warranty">Bảo hành</option>
              <option value="returned">Đã trả</option>
            </select>
            <button class="btn btn-dark" type="submit">Lọc</button>
          </form>
          <div id="serialTable" class="admin-table-wrap loading-box">Đang tải Serial...</div>
        </section>
      </section>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/admin/admin-api.js"></script>
  <script src="../assets/js/admin/admin-layout.js"></script>
  <script src="../assets/js/admin/inventory.js"></script>
</body>
</html>
