<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đánh giá - AeroTech</title>
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin-shell"><aside id="adminSidebar" class="admin-sidebar"></aside><main class="admin-main">
    <header id="adminTopbar" class="admin-topbar"></header>
    <section class="admin-content">
      <div class="admin-page-heading"><p class="eyebrow">Reviews</p><h1>Duyệt đánh giá</h1><p class="page-subtitle">Kiểm tra đánh giá từ khách đã mua hàng trước khi công khai.</p></div>
      <section class="admin-panel">
        <form id="reviewFilterForm" class="admin-filter-bar"><select id="reviewStatus"><option value="">Tất cả trạng thái</option><option value="pending">Chờ duyệt</option><option value="approved">Đã duyệt</option><option value="rejected">Từ chối</option></select><button class="btn btn-dark" type="submit">Lọc</button></form>
        <div id="reviewMessage"></div><div id="reviewTable" class="admin-table-wrap loading-box">Đang tải đánh giá...</div>
      </section>
    </section>
  </main></div>
  <script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/utils.js"></script><script src="../assets/js/auth.js"></script><script src="../assets/js/admin/admin-api.js"></script><script src="../assets/js/admin/admin-layout.js"></script><script src="../assets/js/admin/reviews.js"></script>
</body>
</html>
