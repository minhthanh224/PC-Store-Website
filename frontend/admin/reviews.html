<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý đánh giá - AeroTech</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside id="adminSidebar" class="admin-sidebar"></aside>
    <main class="admin-main">
      <header id="adminTopbar" class="admin-topbar"></header>
      <section class="admin-content">
        <div class="admin-page-heading">
          <p class="eyebrow">Reviews</p>
          <h1>Quản lý đánh giá</h1>
          <p class="page-subtitle">Duyệt đánh giá sản phẩm từ khách hàng đã mua.</p>
        </div>

        <section class="admin-panel">
          <form id="reviewFilterForm" class="admin-filter-bar">
            <select id="reviewStatusFilter" aria-label="Lọc trạng thái đánh giá">
              <option value="pending">Chờ duyệt</option>
              <option value="approved">Đã duyệt</option>
              <option value="rejected">Đã từ chối</option>
              <option value="all">Tất cả</option>
            </select>
            <input id="reviewSearchInput" type="search" placeholder="Tìm sản phẩm, SKU, khách hàng, email">
            <button class="btn btn-dark" type="submit">Lọc</button>
            <button id="resetReviewFilterBtn" class="btn btn-light" type="button">Làm mới</button>
          </form>
          <div id="reviewMessage"></div>
          <div id="reviewTable" class="admin-table-wrap loading-box">Đang tải đánh giá...</div>
          <div id="reviewPagination" class="pagination"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/admin/admin-api.js"></script>
  <script src="../assets/js/admin/admin-layout.js"></script>
  <script src="../assets/js/admin/reviews.js"></script>
</body>
</html>
