<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý thương hiệu - AeroTech</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside id="adminSidebar" class="admin-sidebar"></aside>
    <main class="admin-main">
      <header id="adminTopbar" class="admin-topbar"></header>
      <section class="admin-content">
        <div class="admin-page-heading">
          <p class="eyebrow">Catalog</p>
          <h1>Thương hiệu</h1>
          <p class="page-subtitle">Quản lý các hãng sản xuất và thương hiệu sản phẩm.</p>
        </div>
        <form id="brandForm" class="admin-panel admin-inline-form">
          <input id="brandId" type="hidden">
          <label>Tên thương hiệu<input id="brandName" placeholder="Ví dụ: ASUS" required></label>
          <label>Slug<input id="brandSlug" placeholder="asus" required></label>
          <label>Mô tả<input id="brandDescription" placeholder="Mô tả ngắn"></label>
          <label>Trạng thái<select id="brandStatus">
            <option value="active">Đang hoạt động</option>
            <option value="inactive">Ngừng hoạt động</option>
          </select></label>
          <button class="btn btn-primary" type="submit">Lưu</button>
          <button id="resetBrandFormBtn" class="btn btn-light" type="button">Làm mới</button>
        </form>
        <div id="brandMessage"></div>
        <div id="brandTable" class="admin-table-wrap loading-box">Đang tải thương hiệu...</div>
      </section>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/admin/admin-api.js"></script>
  <script src="../assets/js/admin/admin-layout.js"></script>
  <script src="../assets/js/admin/brands.js"></script>
</body>
</html>
