<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - AeroTech</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main class="container auth-page">
    <section class="auth-card">
      <p class="eyebrow">Tài khoản khách hàng</p>
      <h1>Đăng nhập</h1>
      <form id="loginForm" class="stack-form">
        <label>
          Email
          <input id="loginEmail" type="email" required placeholder="Email">
        </label>
        <label>
          Mật khẩu
          <input id="loginPassword" type="password" required placeholder="Mật khẩu">
        </label>
        <button class="btn btn-primary" type="submit">Đăng nhập</button>
      </form>
      <p class="form-note">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
      <div id="authMessage"></div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart-store.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
