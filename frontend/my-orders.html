<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử mua hàng - AeroTech</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main class="container orders-page">
    <div class="page-heading">
      <p class="eyebrow">Đơn hàng</p>
      <h1>Lịch sử mua hàng</h1>
    </div>

    <div id="orderTabs" class="order-tabs">
      <button class="active" type="button" data-status="">Tất cả</button>
      <button type="button" data-status="pending">Chờ duyệt</button>
      <button type="button" data-status="approved">Đã duyệt</button>
      <button type="button" data-status="shipping">Đang giao</button>
      <button type="button" data-status="completed">Hoàn thành</button>
      <button type="button" data-status="cancelled">Đã hủy</button>
    </div>

    <div id="orderList" class="order-list loading-box">Đang tải đơn hàng...</div>
  </main>

  <footer id="siteFooter"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart-store.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/my-orders.js"></script>
</body>
</html>
