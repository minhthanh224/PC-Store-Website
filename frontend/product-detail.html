<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm - AeroTech</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main class="container detail-page">
    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
    <div id="productDetail" class="detail-loading loading-box">Đang tải sản phẩm...</div>
    <section class="storefront-section related-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Gợi ý</p>
          <h2>Sản phẩm liên quan</h2>
        </div>
      </div>
      <div id="relatedProducts" class="product-grid"></div>
    </section>

    <section class="storefront-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Đánh giá</p>
          <h2>Đánh giá sản phẩm</h2>
        </div>
      </div>
      <div id="productReviews" class="review-panel loading-box">Đang tải đánh giá...</div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart-store.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/product-detail.js"></script>
</body>
</html>
